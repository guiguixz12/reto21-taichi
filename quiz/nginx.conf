server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json
               image/svg+xml image/webp video/mp4;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # HTML: sin caché (siempre fresco)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Estáticos (imágenes, vídeo poster): caché larga
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # MP4 con soporte de range requests (necesario para seek en vídeo)
    location ~* \.mp4$ {
        expires 1d;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
